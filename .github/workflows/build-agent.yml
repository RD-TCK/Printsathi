name: Build PrintSaathi Agent

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-agent:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript agent
        run: npm run build:agent:tsc

      - name: Package native Windows desktop app
        run: npm run build:desktop

      - name: Upload Desktop Agent Installer
        uses: actions/upload-artifact@v4
        with:
          name: PrintSaathiAgent-Windows-Desktop
          path: dist/PrintSaathiAgent.exe