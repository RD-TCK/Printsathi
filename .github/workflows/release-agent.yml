name: Release Desktop Agent

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Windows Agent
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript agent
        run: npm run build:agent:tsc

      - name: Package native Windows desktop installer
        run: npm run build:desktop

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          name: "PrintSaathi Desktop Agent ${{ github.ref_name }}"
          body: |
            ## PrintSaathi Windows Desktop Agent ${{ github.ref_name }}

            ### Installation
            1. Download `PrintSaathiAgent.exe` below
            2. Run the installer and launch PrintSaathi from the Start menu
            3. Sign in with your PrintSaathi shop-owner account in the desktop app
            4. Leave the app running in the Windows notification area for automatic printing

            ### What's included
            - Native Windows desktop window and system tray app
            - Background agent remains active after the window is closed
            - Automatic printer discovery and print job handling
          files: |
            dist/PrintSaathiAgent.exe
          draft: false
          prerelease: false
