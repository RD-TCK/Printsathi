name: Release Desktop Agent

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Windows Agent
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript agent
        run: npm run build:agent:tsc

      - name: Package native Windows desktop installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:desktop

      - name: Prepare release assets with backward-compatible aliases
        shell: pwsh
        run: |
          if (Test-Path dist/PrintivaAgent.exe) {
            Copy-Item dist/PrintivaAgent.exe dist/PrintSaathiAgent.exe -Force
          }

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          name: "Printiva Desktop Agent ${{ github.ref_name }}"
          body: |
            ## Printiva Windows Desktop Agent ${{ github.ref_name }}

            ### Installation
            1. Download `PrintivaAgent.exe` (or `PrintSaathiAgent.exe`) below
            2. Run the installer and launch Printiva from the Start menu
            3. Sign in with your Printiva shop-owner account in the desktop app
            4. Leave the app running in the Windows notification area for automatic printing

            ### What's included
            - Native Windows desktop window and system tray app
            - Background agent remains active after the window is closed
            - Automatic printer discovery and print job handling
            - Two-second job polling, including existing agent configurations
            - Updated subscription billing, expiry recovery, and platform admin monitoring
          files: |
            dist/PrintivaAgent.exe
            dist/PrintSaathiAgent.exe
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
